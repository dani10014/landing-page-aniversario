<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">    
    <link rel="stylesheet" href="./dist/css/main.css">
    <title>Aniversario</title>
</head>
<body>
    <header>
        <div class="cabecalho">
            <div class="container py-4 d-flex justify-content-between align-items-center">
                <h6 class="mb-0 text-light">Pericles confirmado</h6>
                <button class="btn btn-light">
                    Confirmar presença
                </button>
            </div>
        </div>
    </header>
    <main>
        <div class="container-foto-hero">
            <img src="./src/imagens/capa-péricles.png">
        </div>
        <section class="secao-nome-e-data">
            <div class="container py-4 pt-5 text-center secao-nome-e-data__container">
                <h1>Aniversario</h1>
                <p>Meu aniversario no dia() na grande casa de festas,Não fique de fora do maior evento do ano!</p>
                <button class="btn btn-light secao-nome-e-data__container__btn">Confirmar presença</button>
            </div>
        </section>
        <section class="regras-e-detalhes">
            <div class="container px-5 pt-2 d-flex justify-content-center text-center">
                <ul class="container__lista d-flex gap-2 text-center">
                    <li>Pagamento de taxa de entrada</li>
                    <li class="text-center">Proibido bebidas de fora</li>
                    <li>Proibido consumo de bebidas alcoolicas para menores</li>
                </ul>
            </div>
        </section>
        <section class="shows-confirmados">
            <div class="container px-5 pb-5">
                <h2 class="text-center mb-5">Shows confirmados</h2>
                <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
                    <ol class="carousel-indicators" id="indicadores-de-slide">
                        <li data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></li>
                        <li data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></li>
                        <li data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></li>
                    </ol>
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img class="d-block w-100" src="./src/imagens/capa-péricles.png" alt="First slide">
                    </div>
                    <div class="carousel-item">
                        <img class="d-block w-100" src="./src/imagens/jads-jadson.jpeg" alt="Second slide">
                    </div>
                    <div class="carousel-item">
                        <img class="d-block w-100" src="./src/imagens/jorge-e-matheus.jpg" alt="Third slide">
                    </div>
                </div>
                    <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </a>
                    <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </a>
                </div>
                <button class="btn btn-light secao-nome-e-data__container__btn mt-5">Confirmar presença</button>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
